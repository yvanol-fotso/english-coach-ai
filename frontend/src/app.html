<!doctype html>
<html lang="%lang%" data-theme="%theme%" data-accent="%accent%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English Coach</title>
    <meta name="description" content="%description%" />
    <meta name="theme-color" content="#0f5c55" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="English Coach" />
    <meta property="og:title" content="English Coach" />
    <meta property="og:description" content="%description%" />
    <meta property="og:image" content="%origin%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="English Coach" />
    <meta name="twitter:description" content="%description%" />
    <meta name="twitter:image" content="%origin%/og.png" />
    <script>
      (() => {
        const root = document.documentElement;
        if (root.dataset.theme === 'system') {
          root.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
