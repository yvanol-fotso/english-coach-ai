# Optional: Postgres in Docker, so nothing needs to be installed on your machine.
#   docker compose up -d db
# then set DB_MODE=postgres in backend/.env and: pip install -r backend/requirements-postgres.txt
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-english_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-english_coach}
      POSTGRES_DB: ${POSTGRES_DB:-english_coach}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-english_coach}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
